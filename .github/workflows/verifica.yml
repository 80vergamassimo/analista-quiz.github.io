# Generated by tools/quiz/esporta-pubblico.mjs in the private repo.
# Do not edit here: the next export overwrites it.
#
# This repository only ever receives generated artifacts, so the real checks
# live upstream. These two exist because they cannot: one guards against a
# hand-edit landing here, the other proves the live deployment matches the
# commit.
name: Verifica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contenuto:
    name: Committed tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing from the private repo may reach this one: no lecture notes, no
      # slides, no exam questions, no glossaries. It is the only irreversible
      # mistake in the whole pipeline.
      - name: No private material
        run: |
          if find . -path ./.git -prune -o \
               \( -name notes -o -name sources -o -name glossario.md \
                  -o -name 'quiz-errori.json' -o -name '*.mjs' -o -name '*.py' \) \
               -print | grep -q .; then
            echo "::error::private material in the published tree"
            find . -path ./.git -prune -o \
              \( -name notes -o -name sources -o -name glossario.md \
                 -o -name 'quiz-errori.json' -o -name '*.mjs' -o -name '*.py' \) -print
            exit 1
          fi
          test -z "$(find exams -name 'domande-esame.md' -size +0c)" \
            || { echo "::error::domande-esame.md is not empty"; exit 1; }

      # sw.js must sit at the root: only a root script can claim scope `/`, and
      # without that the redirect page stays outside the cache — the app then
      # installs from the bare domain and never starts offline.
      - name: Service worker is anchored at the root
        run: |
          test -f sw.js || { echo "::error::sw.js is not at the root"; exit 1; }
          test ! -f tools/quiz/sw.js || { echo "::error::stale sw.js next to the app"; exit 1; }
          test -f .nojekyll || { echo "::error::.nojekyll missing"; exit 1; }
          if grep -q '__[A-Z]*__' sw.js; then
            echo "::error::unsubstituted placeholder in sw.js"; exit 1
          fi
          node --check sw.js

  sito:
    name: Live site
    needs: contenuto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Waits for Pages to publish THIS commit, identified by the service
      # worker version — which is a hash of the exported content, so it is an
      # exact match and not a guess.
      - name: Wait for Pages to publish this commit
        run: |
          atteso=$(grep -o "VERSIONE = '[^']*'" sw.js)
          for i in $(seq 1 40); do
            vivo=$(curl -fsS https://lm77-quiz.github.io/sw.js 2>/dev/null | grep -o "VERSIONE = '[^']*'" || true)
            [ "$vivo" = "$atteso" ] && { echo "published: $atteso"; exit 0; }
            sleep 15
          done
          echo "::error::Pages did not publish this commit within 10 minutes (expected $atteso)"
          exit 1

      - name: Everything the app needs is served
        run: |
          for p in "" tools/quiz/ sw.js tools/quiz/manifest.webmanifest \
                   tools/quiz/config-pubblico.json tools/quiz/icone/icona-512.png \
                   tools/quiz/icone/apple-touch-icon.png tools/quiz/exams.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://lm77-quiz.github.io/$p")
            echo "  $code  /$p"
            [ "$code" = 200 ] || { echo "::error::/$p returned $code"; exit 1; }
          done
          for s in $(ls exams); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://lm77-quiz.github.io/exams/$s/flashcards.md")
            echo "  $code  /exams/$s/flashcards.md"
            [ "$code" = 200 ] || { echo "::error::flashcards of $s returned $code"; exit 1; }
          done

      # The mirror image: what must NOT be reachable, checked against the
      # deployment rather than against the tree.
      - name: Private material is not reachable
        run: |
          for s in $(ls exams); do
            for p in "exams/$s/notes/" "exams/$s/README.md" "exams/$s/glossario.md"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://lm77-quiz.github.io/$p")
              echo "  $code  /$p"
              [ "$code" = 404 ] || { echo "::error::/$p is reachable ($code)"; exit 1; }
            done
          done

env:
  SITO: https://lm77-quiz.github.io/
